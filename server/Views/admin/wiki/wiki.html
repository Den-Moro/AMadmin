<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Wiki — AMadmin</title>
<link rel="stylesheet" href="/admin/shared/admin.css">
<script src="/admin/shared/ui.js"></script>
<style>
    /* Мини-Wiki: слева поиск и дерево разделов, справа статья / редактор / результаты. */
    main { max-width: 1440px; }
    .wiki { display: grid; grid-template-columns: 280px minmax(0, 1fr); gap: 20px; align-items: start; }
    .wiki-side { position: sticky; top: 16px; display: flex; flex-direction: column; gap: 10px; max-height: calc(100vh - 32px); }
    .wiki-side .search-wrap { min-width: 0; }
    .wiki-tree { overflow-y: auto; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 8px; min-height: 120px; }
    .tree-sec { margin-bottom: 2px; }
    .tree-sec-head { display: flex; align-items: center; gap: 4px; padding: 5px 6px; border-radius: 7px; cursor: pointer; font-weight: 650; font-size: 13px; color: var(--text); user-select: none; }
    .tree-sec-head:hover { background: var(--surface-2); }
    .tree-sec-head .caret { width: 14px; height: 14px; transition: transform .15s; color: var(--muted); flex: none; }
    .tree-sec.collapsed > .tree-sec-head .caret { transform: rotate(-90deg); }
    .tree-sec.collapsed > .tree-children { display: none; }
    .tree-sec-head .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .tree-sec-head .cnt { font-size: 11px; color: var(--muted); font-weight: 500; }
    .tree-sec-head .sec-more { opacity: 0; padding: 0 5px; border: none; background: transparent; color: var(--muted); }
    .tree-sec-head:hover .sec-more, .tree-sec-head .sec-more:focus-visible { opacity: 1; }
    .tree-children { padding-left: 14px; }
    .tree-art { display: block; padding: 4px 8px; border-radius: 7px; color: var(--text-2); text-decoration: none; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .tree-art:hover { background: var(--surface-2); color: var(--text); }
    .tree-art.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
    .wiki-main { min-width: 0; }
    .wiki-crumbs { font-size: 13px; color: var(--muted); margin-bottom: 4px; }
    .wiki-crumbs a { color: var(--muted); text-decoration: none; }
    .wiki-crumbs a:hover { color: var(--accent); }
    .art-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 4px; }
    .art-head h1 { margin: 0; font-size: 26px; letter-spacing: -.4px; }
    .art-meta { font-size: 12.5px; color: var(--muted); margin-bottom: 16px; }

    /* Тело статьи */
    .wiki-body { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 22px 26px; font-size: 14.5px; line-height: 1.65; }
    .wiki-body > :first-child { margin-top: 0; }
    .wiki-body > :last-child { margin-bottom: 0; }
    .wiki-body h2 { font-size: 19px; margin: 22px 0 8px; }
    .wiki-body h3 { font-size: 16px; margin: 18px 0 6px; }
    .wiki-body h4 { font-size: 14.5px; margin: 14px 0 4px; }
    .wiki-body p { margin: 0 0 10px; }
    .wiki-body ul, .wiki-body ol { margin: 0 0 10px; padding-left: 24px; }
    .wiki-body li { margin: 3px 0; }
    .wiki-body img { max-width: 100%; border-radius: 8px; border: 1px solid var(--border); margin: 6px 0; cursor: zoom-in; }
    .wiki-body pre { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; overflow-x: auto; font-family: var(--mono); font-size: 12.5px; line-height: 1.5; }
    .wiki-body code { font-family: var(--mono); font-size: 12.5px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 5px; padding: 1px 5px; }
    .wiki-body pre code { background: none; border: none; padding: 0; }
    .wiki-body blockquote { margin: 0 0 10px; padding: 10px 14px; border-left: 3px solid var(--accent); background: var(--accent-soft); border-radius: 0 8px 8px 0; color: var(--text-2); }
    .wiki-body a.missing { color: var(--danger); text-decoration: underline dotted; }
    .wiki-body hr { border: none; border-top: 1px solid var(--border); margin: 18px 0; }
    .wiki-body table { box-shadow: none; margin: 0 0 10px; }

    /* Редактор */
    .editor-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px; }
    .editor-grid textarea { width: 100%; min-height: 460px; font-family: var(--mono); font-size: 13px; line-height: 1.55; resize: vertical; }
    .editor-grid .wiki-body { min-height: 460px; max-height: 70vh; overflow: auto; }
    .md-toolbar { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 6px; }
    .md-toolbar button { padding: 4px 9px; font-size: 12.5px; }
    .md-toolbar .sep { width: 1px; background: var(--border); margin: 2px 4px; }
    .editor-grid textarea.over { border-color: var(--accent); box-shadow: var(--ring); }

    /* Поиск и главная */
    .hits { display: flex; flex-direction: column; gap: 8px; }
    .hit { display: block; padding: 12px 16px; border-radius: var(--radius-sm); background: var(--surface); border: 1px solid var(--border); text-decoration: none; color: inherit; }
    .hit:hover { border-color: var(--accent-line); }
    .hit b { font-size: 14.5px; color: var(--text); }
    .hit .snip { font-size: 13px; color: var(--text-2); margin-top: 3px; }
    .hit .sec { font-size: 12px; color: var(--muted); }
    mark { background: var(--warning-soft); color: inherit; border-radius: 3px; padding: 0 2px; }
    .home-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
    .home-sec { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; }
    .home-sec h3 { margin: 0 0 6px; font-size: 15px; display: flex; justify-content: space-between; gap: 8px; }
    .home-sec h3 a { color: var(--text); text-decoration: none; }
    .home-sec ul { margin: 0; padding-left: 18px; font-size: 13px; }
    .home-sec li a { color: var(--text-2); text-decoration: none; }
    .home-sec li a:hover { color: var(--accent); }

    @media (max-width: 1000px) {
        .wiki { grid-template-columns: minmax(0, 1fr); }
        .wiki-side { position: static; max-height: none; }
        .wiki-tree { max-height: 300px; }
        .editor-grid { grid-template-columns: minmax(0, 1fr); }
    }
</style>
</head>
<body class="app">
<aside id="sidebar" class="sidebar"></aside>

<main>
    <div class="page-head">
        <div>
            <h1>Wiki</h1>
            <p class="muted">Своя база знаний: инструкции для кассиров, заметки для администраторов, «как починить» по
            разделам. Статью можно приложить к оповещению как инструкцию. Поиск — клавиша <code class="inline">/</code>.</p>
        </div>
        <div class="actions">
            <button type="button" id="newSectionBtn" title="Новый раздел (можно вложить в другой раздел)"></button>
            <button type="button" id="newArticleBtn" class="primary" title="Новая статья в выбранном разделе"></button>
        </div>
    </div>

    <div class="wiki">
        <aside class="wiki-side">
            <div class="search-wrap"><span id="searchIcon"></span><input type="search" id="search" placeholder="Поиск по Wiki…  ( / )" autocomplete="off"></div>
            <nav class="wiki-tree" id="tree" aria-label="Разделы Wiki"></nav>
        </aside>
        <section class="wiki-main" id="view"></section>
    </div>
</main>

<script src="/admin/shared/api.js"></script>
<script src="/admin/shared/nav.js"></script>
<script src="/admin/wiki/markdown.js"></script>
<script src="/admin/wiki/wiki.js"></script>
</body>
</html>
