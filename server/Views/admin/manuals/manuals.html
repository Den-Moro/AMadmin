<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Мануалы — AMadmin</title>
<link rel="stylesheet" href="/admin/shared/admin.css">
<script src="/admin/shared/ui.js"></script>
</head>
<body class="app">
<aside id="sidebar" class="sidebar"></aside>

<main>
    <div class="page-head">
        <div>
            <h1>Библиотека мануалов</h1>
            <p class="muted">Готовые инструкции для кассиров, которые прикладываются к оповещениям. Текст копируется в оповещение при отправке — поздняя правка мануала уже отправленное не меняет.</p>
        </div>
        <div class="actions">
            <button type="button" id="addBtn" class="primary">＋ Мануал</button>
        </div>
    </div>

    <div class="toolbar">
        <input type="search" id="search" placeholder="Поиск по названию и тексту…">
    </div>
    <table id="manualsTable">
        <thead><tr><th>Название</th><th>Текст / ссылка</th><th>Обновлён</th><th></th></tr></thead>
        <tbody></tbody>
    </table>
</main>

<script src="/admin/shared/api.js"></script>
<script src="/admin/shared/nav.js"></script>
<script src="/admin/manuals/manuals.js"></script>
</body>
</html>
