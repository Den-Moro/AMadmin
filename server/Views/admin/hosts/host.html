<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Хост — AMadmin</title>
<link rel="stylesheet" href="/admin/shared/admin.css">
<script src="/admin/shared/ui.js"></script>
<style>
    /* Профиль хоста: карточка фактов слева, действия справа, ниже — две ленты истории. */
    .facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px 20px; }
    .fact .k { font-size: 11.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; font-weight: 600; }
    .fact .v { font-size: 15px; margin-top: 2px; word-break: break-word; }
    .crumbs { font-size: 13px; color: var(--muted); margin-bottom: 6px; }
    .crumbs a { color: var(--muted); text-decoration: none; }
    .crumbs a:hover { color: var(--accent); }
    .head-actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .status-line { display: flex; align-items: center; gap: 10px; margin-top: 4px; }
    .quick-wait { display: flex; align-items: center; gap: 10px; color: var(--text-2); }
    .spinner { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--border-strong); border-top-color: var(--accent); animation: spin 0.8s linear infinite; flex: none; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .quick-out pre.output { max-height: 52vh; }
</style>
</head>
<body class="app">
<aside id="sidebar" class="sidebar"></aside>

<main>
    <div class="crumbs"><a href="/admin/hosts">Хосты</a> / <span id="crumbName">…</span></div>
    <div class="page-head">
        <div>
            <h1 id="title">…</h1>
            <div class="status-line"><span id="statusBadge" class="badge badge-neutral">загрузка</span><span class="muted" id="statusText"></span></div>
        </div>
        <div class="head-actions">
            <button type="button" id="refreshBtn" class="ghost" title="Перечитать данные хоста (и так обновляются каждые 30 секунд)"></button>
            <span id="adminActions" hidden style="display:inline-flex;gap:8px;flex-wrap:wrap">
                <button type="button" id="quickBtn" class="primary" title="Посмотреть процессы, службы, место на дисках или сеть этой кассы — результат прямо здесь"></button>
                <button type="button" id="notifyBtn" title="Отправить оповещение только на этот ПК"></button>
                <button type="button" id="editBtn" title="Магазин, тип устройства, понятное имя"></button>
                <button type="button" id="moreBtn" class="icon-only" title="Ещё: config.json, новый ключ, удаление">⋯</button>
            </span>
        </div>
    </div>

    <div class="row-2">
        <div class="card compact">
            <h2>Карточка</h2>
            <div class="facts" id="facts"></div>
        </div>
        <div class="card compact">
            <h2>Итоги</h2>
            <div class="facts" id="totals"></div>
            <h2 style="margin-top:8px">Группы</h2>
            <div id="groups" class="muted"></div>
        </div>
    </div>

    <h1>Результаты команд на этом хосте</h1>
    <table id="resultsTable">
        <thead><tr><th>Когда</th><th>Команда</th><th>Автор</th><th>Статус</th><th>Результат</th></tr></thead>
        <tbody></tbody>
    </table>

    <h1>Подтверждённые оповещения</h1>
    <table id="acksTable">
        <thead><tr><th>Когда</th><th>Оповещение</th><th>Важность</th><th>Открыл инструкцию</th></tr></thead>
        <tbody></tbody>
    </table>
</main>

<script src="/admin/shared/api.js"></script>
<script src="/admin/shared/nav.js"></script>
<script src="/admin/hosts/host.js"></script>
</body>
</html>
