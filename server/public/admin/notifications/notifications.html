<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Оповещения — AMadmin</title>
<link rel="stylesheet" href="/admin/shared/admin.css">
</head>
<body>
<header class="topbar">
    <div class="brand">AMadmin</div>
    <nav>
        <a href="/admin/index.html">Дашборд</a>
        <a href="/admin/notifications/notifications.html" class="active">Оповещения</a>
        <a href="/admin/groups/groups.html">Группы</a>
        <a href="/admin/manuals/manuals.html">Мануалы</a>
        <a href="/admin/commands/commands.html">Команды</a>
        <a href="/admin/settings/settings.html">Настройки</a>
    </nav>
    <button id="logoutBtn">Выйти</button>
</header>

<main>
    <h1>Новое оповещение</h1>
    <form id="createForm" class="card">
        <label>Текст
            <span class="hint">То, что увидит кассир. Пишите просто и по делу: что происходит,
            как это его касается и что делать. Человек читает это между покупателями.</span>
            <textarea id="text" rows="3" required></textarea>
        </label>

        <div class="row">
            <label>Важность
                <span class="hint">Важное — окно поверх всех программ, закрыть можно только
                прочитав. Неважное — ведёт себя по настройке из раздела «Настройки»
                (обычно мягко, в углу).</span>
                <select id="priority">
                    <option value="normal">Неважное</option>
                    <option value="important">Важное</option>
                </select>
            </label>
            <label>Размер окна
                <span class="hint">Крупное заметнее, но сильнее перекрывает экран кассы.</span>
                <select id="size">
                    <option value="small">Маленькое</option>
                    <option value="medium" selected>Среднее</option>
                    <option value="large">Крупное</option>
                </select>
            </label>
        </div>

        <div class="row">
            <label>Кому
                <span class="hint">Всем — на все ПК сразу. Магазину — только этой точке.
                Группе — своему набору касс (создаётся в разделе «Группы»). Типу устройства —
                например, только кассам или только ПК менеджеров.</span>
                <select id="targetType">
                    <option value="all">Всем</option>
                    <option value="store">Магазину</option>
                    <option value="group">Группе хостов</option>
                    <option value="device_type">Типу устройства</option>
                    <option value="pc">Конкретному ПК</option>
                </select>
            </label>
            <label id="targetIdWrap" style="display:none">Кто именно
                <span class="hint">Конкретный получатель для выбранного типа.</span>
                <select id="targetId"></select>
            </label>
        </div>

        <label>Мануал из библиотеки (необязательно)
            <span class="hint">Готовая инструкция из раздела «Мануалы». Её текст подставится
            в поле ниже — потом его можно поправить под этот конкретный случай.</span>
            <select id="manualPicker">
                <option value="">— не выбирать —</option>
            </select>
        </label>
        <label>Ссылка/текст мануала (необязательно)
            <span class="hint">Если заполнено, в окне появится кнопка «Открыть инструкцию», и
            закрыть окно можно будет только после того, как кассир её откроет. Можно вписать
            текст шагов или ссылку — ссылка откроется в браузере.</span>
            <textarea id="manualUrl" rows="2"></textarea>
        </label>

        <button type="submit">Отправить</button>
        <p id="error" class="error"></p>
        <p id="success" class="success"></p>
    </form>

    <h1>История оповещений</h1>
    <table id="notificationsTable">
        <thead>
            <tr>
                <th>Когда создано</th>
                <th>Текст</th>
                <th>Важность</th>
                <th>Показов</th>
                <th>Подтверждений</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>
</main>

<script src="/admin/shared/api.js"></script>
<script src="notifications.js"></script>
</body>
</html>
