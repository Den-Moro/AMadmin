<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Дашборд — AMadmin</title>
<link rel="stylesheet" href="shared/admin.css">
</head>
<body>
<header class="topbar">
    <div class="brand">AMadmin</div>
    <nav>
        <a href="/admin/index.html" class="active">Дашборд</a>
        <a href="/admin/notifications/notifications.html">Оповещения</a>
        <a href="/admin/groups/groups.html">Группы</a>
        <a href="/admin/manuals/manuals.html">Мануалы</a>
        <a href="/admin/commands/commands.html">Команды</a>
    </nav>
    <button id="logoutBtn">Выйти</button>
</header>

<main>
    <h1>ПК магазинов</h1>
    <div class="filters">
        <input type="text" id="search" placeholder="Поиск: hostname, пользователь, магазин…">
        <select id="storeFilter"><option value="">Все магазины</option></select>
        <select id="deviceTypeFilter"><option value="">Все типы устройств</option></select>
    </div>
    <table id="pcsTable">
        <thead>
            <tr>
                <th>Статус</th>
                <th>Магазин</th>
                <th>Хост \ Пользователь</th>
                <th>Тип устройства</th>
                <th>Версия агента</th>
                <th>Последний раз на связи</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>
</main>

<script src="shared/api.js"></script>
<script src="dashboard.js"></script>
</body>
</html>
