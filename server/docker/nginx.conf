server {
    listen 80;
    server_name amadmin;

    root /app/public;
    index index.php;

    # Раскатка файлов на кассы (POST /admin/files) — лимит должен совпадать с
    # upload_max_filesize/post_max_size в conf.d/uploads.ini.
    client_max_body_size 520M;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;

    # Папки панели (admin/stores, admin/commands, ...) совпадают с путями API
    # (/admin/stores, /admin/commands). $uri без $uri/ в списке try_files — значит
    # директория без реального файла с таким именем в index.php не «найдена», и
    # запрос уходит в index.php как API, а не как редирект на индекс папки (аналог
    # Apache DirectorySlash Off). Реальный файл — отдаётся как есть.
    location / {
        try_files $uri /index.php$is_args$args;
    }

    location = /index.php {
        fastcgi_pass 127.0.0.1:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        # PHP-FPM (в отличие от mod_php) не получает Authorization по умолчанию —
        # агенты кассы шлют Bearer-токен, без этой строки Auth::getBearerToken() увидит пусто.
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
        fastcgi_read_timeout 300;
    }

    # В public/ кроме index.php лежит router.php (только для встроенного сервера
    # PHP, режим Native) — под nginx его не должно быть видно ни как текст, ни как
    # исполняемый код.
    location ~ \.php$ {
        deny all;
    }
}
